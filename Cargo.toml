[package]
name = "lambda_dx_pad_preview"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lambda_dx_pad_preview"
path = "src/main.rs"

[dependencies]
macroquad = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
minimp3 = "0.5"
roxmltree = "0.20"
rodio = { version = "0.19", default-features = false, features = ["wav"] }
