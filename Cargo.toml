[package]
name = "lambda_dx_pad_preview"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    ".",
    "lnmai-core/crates/lnmai-core",
    "lnmai-core/crates/lnmai-core-verify",
    "lnmai-rust",
]
exclude = ["lnmai-core-lean", "vendor/egui-miniquad"]

# Gameplay-core backend selection. Exactly one should be enabled:
#   backend-rust (default) — the pure-Rust core vendored under `lnmai-core/`.
#   backend-lean           — the legacy Lean FFI wrapper in `lnmai-core-lean/`.
#   backend-none           — no gameplay core at all (local preview only)
[features]
default = ["backend-rust"]
backend-rust = ["dep:lnmai-core-rust"]
backend-lean = ["dep:lnmai-core"]
backend-none = []
ui-preview = []

[[bin]]
name = "lambda_dx_pad_preview"
path = "src/main.rs"

[[bin]]
name = "lambda_dx_player_ui"
path = "src/player_ui_main.rs"

# Chart editor: standalone pad preview with the egui/macroquad editing chrome.
# Source lives under editor/src/ (self-contained module tree).
[[bin]]
name = "lambda_dx_editor"
path = "editor/src/main.rs"

# Isolated, memory-only workbench design prototype. No gameplay backend needed.
[[bin]]
name = "lambda_dx_ui_preview"
path = "editor/ui_preview/main.rs"
required-features = ["ui-preview"]

[[bin]]
name = "macroanimate_test"
path = "src/macroanimate_test.rs"

[[bin]]
name = "lambdadx_effect_preview"
path = "src/lambdadx_effect_preview.rs"

# Minimal feasibility probe for docs/AUTOPLAY_GENERATOR.md (headless planner).
[[bin]]
name = "autoplay_gen"
path = "src/autoplay_gen/main.rs"

[[bin]]
name = "autoplay_audit"
path = "src/autoplay_audit/main.rs"

[dependencies]
macroquad = { version = "0.4", default-features = false }
# Adobe Animate sparrow / texture-atlas parser + renderer (test bin only).
macroanimate = { path = "macroanimate" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
minimp3 = "0.5"
# Enables JPEG (cover art) decoding for macroquad's texture loader, which only
# pulls in png/tga by default. Feature unification makes this apply upstream.
image = { version = "0.24.9", default-features = false, features = ["jpeg"] }
roxmltree = "0.20"
rodio = { version = "0.19", default-features = false, features = ["wav"] }
egui-macroquad = { version = "0.17", default-features = false }
# Direct egui<->miniquad bridge, vendored in `app::egui_bridge` to add touch
# input to the egui params panel (egui-macroquad only forwards mouse/keyboard).
egui-miniquad = "0.16"
egui_dock = { version = "0.16" }
lucide-icons = { version = "=1.57.0" }
# Gameplay core backend (see [features]): rust (default) or lean (legacy).
lnmai-core = { path = "lnmai-core-lean", optional = true }
lnmai-core-rust = { path = "lnmai-rust", optional = true }

# Macroquad parses every glyph outline at load time; CJK fonts benefit from
# fontdue's existing parallel parser. Keep web builds on the serial path.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fontdue = { version = "0.9", features = ["parallel"] }

# Desktop Linux multi-touch touchscreen input (kernel Type-B evdev).
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

# Trackpad pinch-to-zoom: miniquad's macOS backend drops magnify events, so the
# editor installs its own NSEvent local monitor for the magnify gesture (see
# `editor/src/gesture.rs`). File dialogs use cached, asynchronous AppKit sheets.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSEvent", "NSApplication", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSResponder", "NSWindow", "NSView", "block2"] }
objc2 = "0.5"
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSOperation", "NSThread", "block2"] }
block2 = "0.5"

# Keep egui draw batches from overwriting buffers still being read by the GPU.
[patch.crates-io]
egui-miniquad = { path = "vendor/egui-miniquad" }

# The expensive load work (JPEG decode, CJK font parsing, note-texture decode)
# runs inside dependencies, so an unoptimized `cargo run` is ~7x slower to boot
# and stutters on cover/song changes. Optimize dependencies even in dev.
#
# `debug-assertions = false` for dependencies: egui-miniquad feeds egui a
# wall-clock (`SystemTime`) time, and emath's `History::add` debug-asserts it is
# monotonic. A backwards clock tick then panics a `cargo run` build with
# "Time shouldn't move backwards" even though it is harmless in release. Our own
# crate keeps its debug assertions.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false

# Our own debug code also has hot loops (audio decode/resample, pad rendering).
# opt-level 1 keeps incremental builds quick while removing the worst stalls.
#
# `incremental = false`: with concurrent edits (multiple agents/sessions writing
# src simultaneously) the incremental cache can reuse stale cross-CGU objects,
# leaving anonymous `_anon.*.llvm.*` share-generics symbols undefined at link
# time (bins fail to link while `cargo check` passes). Disabling it makes dev
# links deterministic; a `cargo clean` / deleting target/debug/incremental is no
# longer needed.
[profile.dev]
opt-level = 1
# incremental = false
