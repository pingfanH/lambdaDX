[package]
name = "lnmai-core-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust `lnmai_core` port. Defaults to the committed stub in `port/` so the
# crate graph always resolves; point this at the real port (package `lnmai_core`)
# to use it. The vendored `lnmai-core/` (Lean FFI) is left unmodified.
lnmai_core_rs = { package = "lnmai-core-rs", path = "port" }
