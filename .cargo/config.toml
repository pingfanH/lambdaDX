# Pinned Lake checkout of Neuron-Group/lnmai-core whose FFI schema matches
# `lnmai-core/shared/rust_ffi_types.rs`. `lnmai-core`'s build script reads this
# when `LNMAI_CORE_ARTIFACTS` is unset. Kept as a plain string (not a
# `{ value, force }` table) so Cargo can merge this with the `pure/` worktree's
# `.cargo/config.toml`, which sets the same key as a string.
[env]
LNMAI_CORE_LEAN_PROJECT = "/Users/pingfanh/project/Mai2Chart/demo/macroquad_sim/lnmai-core-rs/lnmai-core-ffi/lnmai-core"
