[package]
name = "egui-miniquad"
version = "0.16.0"
edition = "2021"
authors = ["Logachev Fedor <not.fl3@gmail.com>", "Emil Ernerfeldt <emil.ernerfeldt@gmail.com>"]
description = "Bindings between egui and miniquad"
license = "MIT OR Apache-2.0"
repository = "https://github.com/not-fl3/egui-miniquad"

[workspace]

[dependencies]
bytemuck = "1.9"
egui = { version = "0.31.1", features = ["bytemuck"] }
miniquad = "0.4.8"
quad-url = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.7", features = ["custom"] }
quad-rand = "0.2.3"

[target.'cfg(target_os = "macos")'.dependencies]
copypasta = "0.10.0"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSArray", "NSAttributedString", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSEvent", "NSGraphicsContext", "NSResponder", "NSView", "NSWindow", "NSTextInputClient", "NSTextInputContext"] }
