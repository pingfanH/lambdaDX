[package]
name = "lambdadx-automation"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
default = []
mcp = ["dep:rmcp", "dep:tokio", "dep:tokio-util", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:uuid"]
agent = ["dep:genai", "dep:tokio", "dep:tokio-util", "dep:futures-util", "dep:reqwest", "dep:url", "dep:dotenvy"]
stdio-bridge = ["mcp", "rmcp/client", "rmcp/transport-io", "rmcp/transport-streamable-http-client-reqwest", "rmcp/reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.2"
rmcp = { version = "=3.6.0", default-features = false, features = ["server", "schemars", "transport-streamable-http-server"], optional = true }
genai = { version = "=0.7.0", default-features = false, features = ["rustls-tls"], optional = true }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "time", "sync", "net"], optional = true }
tokio-util = { version = "0.7", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
url = { version = "2", optional = true }
dotenvy = { version = "0.15", optional = true }

[[bin]]
name = "lambdadx_mcp"
path = "src/bin/lambdadx_mcp.rs"
required-features = ["stdio-bridge"]
